<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Quiz AJ — NF EN 1176</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--surf:#161b22;--surf2:#21262d;--border:#30363d;
  --accent:#58a6ff;--ok:#3fb950;--warn:#d29922;--danger:#f85149;
  --text:#e6edf3;--muted:#7d8590;
  --mono:'SF Mono','Fira Code','Consolas',monospace;
  --sans:-apple-system,'Segoe UI',system-ui,sans-serif;
  --hh:56px;--tbh:64px;--r:10px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;overflow:hidden}

/* HEADER */
header{position:fixed;top:0;left:0;right:0;height:var(--hh);background:var(--surf);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:10px;z-index:100}
.logo{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:1px;text-transform:uppercase;flex:1}
.logo em{color:var(--muted);font-style:normal}
.score-wrap{display:flex;gap:10px;font-family:var(--mono);font-size:13px}
.s-ok{color:var(--ok)}.s-ko{color:var(--danger)}
.burger{width:44px;height:44px;background:none;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;-webkit-tap-highlight-color:transparent}

/* DRAWER */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200}
.overlay.open{display:block}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(290px,85vw);background:var(--surf);border-right:1px solid var(--border);z-index:201;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);overflow-y:auto}
.drawer.open{transform:translateX(0)}
.dh{padding:14px 14px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.dt{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
.dc{width:36px;height:36px;background:none;border:1px solid var(--border);border-radius:6px;color:var(--muted);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.theme-btn{width:100%;padding:11px 14px;background:none;border:none;border-bottom:1px solid var(--border);color:var(--text);font-family:var(--sans);font-size:14px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:54px;-webkit-tap-highlight-color:transparent;transition:background .1s}
.theme-btn:active{background:var(--surf2)}
.theme-btn.active{background:rgba(88,166,255,.08);border-left:3px solid var(--accent);padding-left:11px}
.ti{font-size:18px;width:22px;text-align:center;flex-shrink:0}
.tl{flex:1;min-width:0}
.tn{font-weight:600;font-size:14px;display:block}
.ts{font-size:11px;color:var(--muted);font-family:var(--mono);display:block}

/* MAIN */
.main-wrap{position:fixed;top:var(--hh);left:0;right:0;bottom:var(--tbh);display:flex;flex-direction:column;overflow:hidden}

/* TOOLBAR */
.toolbar{padding:9px 12px;border-bottom:1px solid var(--border);background:var(--surf);display:flex;gap:8px;align-items:center;flex-shrink:0;flex-wrap:wrap}
.btn{height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--border);font-family:var(--mono);font-size:13px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;-webkit-tap-highlight-color:transparent;transition:all .1s}
.bp{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700}.bp:active{background:#79c0ff}.bp:disabled{opacity:.4;cursor:not-allowed}
.bg{background:none;color:var(--text)}.bg:active{background:var(--surf2)}
.mt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}

/* CHAT */
.chat-area{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.welcome{text-align:center;padding:28px 14px;color:var(--muted)}
.welcome h2{font-size:19px;color:var(--text);margin-bottom:8px}
.welcome p{font-size:14px;line-height:1.6;margin-bottom:14px}
.tag-wrap{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tag{background:var(--surf2);border:1px solid var(--border);border-radius:4px;padding:3px 8px;font-family:var(--mono);font-size:11px;color:var(--accent)}
.msg{display:flex;gap:10px;max-width:100%}
.msg.user{flex-direction:row-reverse}
.av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;font-weight:700;flex-shrink:0}
.av-ai{background:rgba(88,166,255,.15);border:1px solid rgba(88,166,255,.3);color:var(--accent)}
.av-us{background:rgba(63,185,80,.15);border:1px solid rgba(63,185,80,.3);color:var(--ok)}
.bubble{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px;font-size:14px;line-height:1.65;max-width:calc(100% - 44px);word-break:break-word}
.msg.user .bubble{background:var(--surf2);border-color:rgba(63,185,80,.25)}
.rt{display:inline-block;background:rgba(88,166,255,.1);border:1px solid rgba(88,166,255,.25);border-radius:3px;padding:0 5px;font-family:var(--mono);font-size:11px;color:var(--accent);margin:0 1px}

/* QCM */
.qc{background:var(--surf2);border:1px solid var(--border);border-radius:var(--r);padding:13px;margin-top:6px}
.ql{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px}
.qt{font-size:15px;font-weight:600;line-height:1.45}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{background:var(--surf);border:1px solid var(--border);border-radius:8px;padding:12px 13px;font-family:var(--sans);font-size:14px;color:var(--text);cursor:pointer;text-align:left;display:flex;gap:10px;align-items:flex-start;min-height:48px;transition:border-color .1s,background .1s;-webkit-tap-highlight-color:transparent}
.opt:active:not(:disabled){background:var(--surf2)}.opt:disabled{cursor:default}
.opt.correct{background:rgba(63,185,80,.1);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:rgba(248,81,73,.1);border-color:var(--danger);color:var(--danger)}
.ol{width:22px;height:22px;border-radius:4px;background:var(--surf2);border:1px solid var(--border);font-family:var(--mono);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.verdict{margin-top:10px;padding:9px 12px;border-radius:8px;font-size:13px;line-height:1.5}
.vok{background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.3);color:var(--ok)}
.vko{background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.3);color:var(--danger)}

/* TYPING */
.tw{display:flex;gap:5px;padding:10px 13px}
.tw span{width:7px;height:7px;background:var(--muted);border-radius:50%;animation:bn 1.2s infinite}
.tw span:nth-child(2){animation-delay:.2s}.tw span:nth-child(3){animation-delay:.4s}
@keyframes bn{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

/* API NOTICE */
.api-notice{background:rgba(210,153,34,.07);border:1px solid rgba(210,153,34,.3);border-radius:var(--r);padding:14px;font-size:13px;color:var(--warn);margin:6px 0}
.api-notice h3{font-size:14px;margin-bottom:8px}
.api-notice p{color:var(--muted);font-size:12px;margin-bottom:10px;line-height:1.6}
.api-row{display:flex;gap:8px}
.api-in{flex:1;background:var(--surf2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:12px;padding:10px 12px;outline:none;min-height:44px}
.api-in:focus{border-color:var(--warn)}
.api-note{margin-top:8px;font-size:12px;color:var(--muted)}

/* INPUT BAR */
.ibar{padding:9px 10px;border-top:1px solid var(--border);background:var(--surf);display:flex;gap:8px;align-items:flex-end;flex-shrink:0}
.minput{flex:1;background:var(--surf2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--sans);font-size:15px;padding:10px 13px;resize:none;outline:none;min-height:44px;max-height:110px;transition:border-color .15s;-webkit-appearance:none}
.minput:focus{border-color:var(--accent)}
.minput::placeholder{color:var(--muted)}
.sendbtn{width:44px;height:44px;background:var(--accent);border:none;border-radius:10px;color:#000;font-size:20px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background .1s;-webkit-tap-highlight-color:transparent}
.sendbtn:active{background:#79c0ff}.sendbtn:disabled{opacity:.4}

/* FLASHCARDS */
.fw{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;overflow-y:auto;gap:14px}
.fp-wrap{width:100%;max-width:500px;height:4px;background:var(--border);border-radius:2px}
.fp-bar{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.flashcard{width:100%;max-width:500px;height:220px;cursor:pointer;perspective:1000px;-webkit-tap-highlight-color:transparent}
.fci{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.flashcard.flipped .fci{transform:rotateY(180deg)}
.fcf{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;padding:20px;display:flex;flex-direction:column;justify-content:center}
.ff{background:var(--surf);border:1px solid var(--border)}
.fb{background:var(--surf2);border:1px solid rgba(88,166,255,.3);transform:rotateY(180deg)}
.flab{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
.fq{font-size:16px;font-weight:700;line-height:1.45}
.fa{font-size:14px;line-height:1.6}
.fr{margin-top:10px;font-family:var(--mono);font-size:12px;color:var(--accent)}
.ftap{font-size:11px;color:var(--muted);margin-top:12px;font-family:var(--mono)}
.fnav{display:flex;gap:10px;align-items:center;width:100%;max-width:500px}
.fnav .btn{flex:1;justify-content:center;height:48px}
.fcnt{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}

/* TAB BAR */
.tabbar{position:fixed;bottom:0;left:0;right:0;height:var(--tbh);background:var(--surf);border-top:1px solid var(--border);display:flex;z-index:100}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;color:var(--muted);cursor:pointer;padding:6px 4px;font-family:var(--sans);font-size:11px;transition:color .15s;-webkit-tap-highlight-color:transparent}
.tab:active{color:var(--text)}.tab.active{color:var(--accent)}
.tabi{font-size:22px;line-height:1}

::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>

<header>
  <button class="burger" onclick="openD()">☰</button>
  <div class="logo">EVN<em>/</em>QUIZ <em>·</em> NF EN 1176</div>
  <div class="score-wrap">
    <span class="s-ok">✓ <span id="sOk">0</span></span>
    <span class="s-ko">✗ <span id="sKo">0</span></span>
  </div>
</header>

<div class="overlay" id="ov" onclick="closeD()"></div>
<div class="drawer" id="dr">
  <div class="dh">
    <span class="dt">Thèmes</span>
    <button class="dc" onclick="closeD()">✕</button>
  </div>
  <button class="theme-btn active" onclick="pickT(this,'general')"><span class="ti">📋</span><span class="tl"><span class="tn">Général</span><span class="ts">NF EN 1176 vue d'ensemble</span></span></button>
  <button class="theme-btn" onclick="pickT(this,'espaces_chute')"><span class="ti">📐</span><span class="tl"><span class="tn">Espaces de chute</span><span class="ts">§4.2.8.3, zones libres</span></span></button>
  <button class="theme-btn" onclick="pickT(this,'garde_corps')"><span class="ti">🔒</span><span class="tl"><span class="tn">Garde-corps</span><span class="ts">§4.2.4, Annexe F, écarts</span></span></button>
  <button class="theme-btn" onclick="pickT(this,'sols')"><span class="ti">🟫</span><span class="tl"><span class="tn">Sols amortissants</span><span class="ts">NF EN 1177, HIC/Gmax</span></span></button>
  <button class="theme-btn" onclick="pickT(this,'bois')"><span class="ti">🪵</span><span class="tl"><span class="tn">Matériaux bois</span><span class="ts">§4.2.8/4.2.9, fissures</span></span></button>
  <button class="theme-btn" onclick="pickT(this,'equipements_fermes')"><span class="ti">🏠</span><span class="tl"><span class="tn">Équipements fermés</span><span class="ts">§4.2.10, maisonnettes</span></span></button>
  <button class="theme-btn" onclick="pickT(this,'toboggan')"><span class="ti">🛝</span><span class="tl"><span class="tn">Toboggans</span><span class="ts">NF EN 1176-2</span></span></button>
  <button class="theme-btn" onclick="pickT(this,'balancoires')"><span class="ti">⚖️</span><span class="tl"><span class="tn">Balançoires</span><span class="ts">NF EN 1176-2, §5</span></span></button>
  <button class="theme-btn" onclick="pickT(this,'fitness')"><span class="ti">💪</span><span class="tl"><span class="tn">Agrès sportifs</span><span class="ts">NF EN 16630</span></span></button>
  <button class="theme-btn" onclick="pickT(this,'amendement2023')"><span class="ti">🆕</span><span class="tl"><span class="tn">Amendement 2023</span><span class="ts">NF EN 1176-1+A1:2023</span></span></button>
  <button class="theme-btn" onclick="pickT(this,'decret')"><span class="ti">⚖️</span><span class="tl"><span class="tn">Décret 96-1136</span><span class="ts">Obligations légales FR</span></span></button>
  <button class="theme-btn" onclick="pickT(this,'inspection')"><span class="ti">🔍</span><span class="tl"><span class="tn">Inspection</span><span class="ts">Fréquences, rapports</span></span></button>
</div>

<div class="main-wrap" id="mw"></div>

<div class="tabbar">
  <button class="tab active" id="tQuiz" onclick="setM('quiz')"><span class="tabi">❓</span>QCM IA</button>
  <button class="tab" id="tChat" onclick="setM('chat')"><span class="tabi">💬</span>Libre</button>
  <button class="tab" id="tFlash" onclick="setM('flash')"><span class="tabi">🃏</span>Flashcards</button>
</div>

<script>
const S={apiKey:localStorage.getItem('evn_k')||'',theme:'general',mode:'quiz',ok:0,ko:0,hist:[],fi:0,busy:false};
const TD={general:"tous les aspects de NF EN 1176 (parties 1-11), NF EN 1177, Décret 96-1136",espaces_chute:"espaces de chute libres, zones de sécurité, §4.2.8.3",garde_corps:"garde-corps, barrières, écartements, §4.2.4, Annexe F",sols:"sols amortissants, NF EN 1177, HIC, Gmax, griffage",bois:"matériaux bois, fissures, §4.2.8/4.2.9",equipements_fermes:"équipements fermés (tunnels, maisonnettes), §4.2.10",toboggan:"toboggans, NF EN 1176-2, pentes, atterrissages",balancoires:"balançoires, NF EN 1176-2, §5, distances, suspensions",fitness:"agrès fitness outdoor adultes, NF EN 16630",amendement2023:"amendement A1:2023, Annexe H, confirmation HIC/Gmax post-installation",decret:"Décret 96-1136, obligations légales, registre",inspection:"inspections IR/IO/IA, fréquences, §9, compétences"};

const FC=[
  {q:"HCL maximale pour un enfant < 3 ans sans sol amortissant obligatoire ?",a:"0,60 m (60 cm). Au-delà le sol amortissant devient obligatoire.",ref:"NF EN 1176-1 §4.2.8.3"},
  {q:"Écart inter-éléments interdit sur un garde-corps (risque coincement tête) ?",a:"Entre 89 mm et 230 mm = zone interdite. Doit être < 89 mm OU > 230 mm.",ref:"NF EN 1176-1 §4.2.4.3 & Annexe F"},
  {q:"La règle des 89 mm s'applique-t-elle à l'écart plancher / traverse basse ?",a:"NON. Cet écart est évalué selon §4.2.4.3 (risque passage corps). Les 89 mm = espacement inter-éléments uniquement (Annexe F).",ref:"NF EN 1176-1 §4.2.4.3 vs Annexe F"},
  {q:"Largeur de fissure bois entraînant non-conformité ?",a:"Non-conforme si largeur > 5–9 mm ET profondeur > 1/3 section OU surface > 1/4 section.",ref:"NF EN 1176-1 §4.2.8/§4.2.9"},
  {q:"Terme normatif correct pour la remise en état du BRF (bois raméal fragmenté) ?",a:"GRIFFAGE (pas « décompactage »). Scarification + remise à niveau de l'épaisseur nominale.",ref:"NF EN 1177 / procédure EVN"},
  {q:"Maisonnette sans ouverture côté mur : distance minimale d'installation ?",a:"Peut être installée à moins de 1,50 m du mur côté sans ouverture (aucun risque de passage).",ref:"NF EN 1176-1 §4.2.10"},
  {q:"À partir de quelle HCL un test HIC/Gmax est-il requis ?",a:"À partir de 0,60 m de hauteur de chute libre.",ref:"NF EN 1177"},
  {q:"Valeur limite absolue du HIC selon NF EN 1177 ?",a:"HIC ≤ 1000.",ref:"NF EN 1177 §4.2"},
  {q:"Fréquence de l'inspection principale annuelle (IA) ?",a:"Annuelle (12 mois max), par un inspecteur compétent certifié.",ref:"NF EN 1176-1 §9.3.4"},
  {q:"Principale nouveauté de l'amendement A1:2023 de NF EN 1176-1 ?",a:"Annexe H : confirmation post-installation des performances HIC/Gmax pour sols synthétiques coulés en place.",ref:"NF EN 1176-1+A1:2023 Annexe H"},
  {q:"Qui est responsable de la sécurité selon le Décret 96-1136 ?",a:"Le propriétaire ou l'exploitant. Obligation de vérification périodique et de tenue d'un registre de sécurité.",ref:"Décret n°96-1136 du 18/12/1996"},
  {q:"Zone de hauteur libre sous équipement à risque de coincement ?",a:"400–500 mm = zone interdite. < 400 mm = OK. > 500 mm = passage libre.",ref:"NF EN 1176-1 §4.2.3"},
  {q:"NF EN 16630 : quelle population cible ?",a:"Adultes ≥ 14 ans pour agrès fitness outdoor. NF EN 1176 vise enfants 1–14 ans.",ref:"NF EN 16630 §1"},
  {q:"Le mobilier urbain (bancs, corbeilles) est-il soumis à NF EN 1176 ?",a:"NON — hors champ. Mais ne doit pas créer de danger dans les zones de sécurité.",ref:"NF EN 1176-1 §1"},
  {q:"Hauteur minimale de balustrade pour enfants < 36 mois avec HCL 600–3000 mm ?",a:"Balustrade ≥ 700 mm + sol amortissant NF EN 1177 obligatoire.",ref:"NF EN 1176-1 §4.2.4"},
  {q:"Format standard EVN pour une observation d'inspection ?",a:"CONSTAT / NORME / RISQUE / SOLUTION. URGENTE = mise hors service immédiate.",ref:"Procédure EVN / NF EN 1176-1 §9"},
  {q:"Définition de la HCL (hauteur de chute libre) ?",a:"Distance verticale maximale entre la position de l'utilisateur sur l'équipement et la surface d'impact.",ref:"NF EN 1176-1 §3.2"},
  {q:"Fréquence de l'inspection opérationnelle (IO) ?",a:"1 à 3 mois selon exposition, matériau, usage. Vérification usure, pièces mobiles.",ref:"NF EN 1176-1 §9.3.3"},
  {q:"Zone de sécurité minimale autour d'un toboggan de HCL 1 m ?",a:"1,50 m de tous côtés, en tenant compte de la trajectoire de sortie.",ref:"NF EN 1176-1 §4.2.8 / NF EN 1176-2"},
  {q:"Espace libre minimal autour d'un manège ?",a:"Diamètre de rotation + 2 × 1,50 m minimum.",ref:"NF EN 1176-3 / NF EN 1176-1 §4.2.8"},
];

function sys(t){return`Tu es expert normalisation aires de jeux pour EVN Strasbourg (EMS).\nNormes : NF EN 1176-1:2017+A1:2023, NF EN 1176 2-11, NF EN 1177:2018, NF EN 16630:2015, Décret 96-1136.\nThème : ${TD[t]||'NF EN 1176 général'}.\nCite toujours l'article exact. Réponses terrain, précises.\nMode QCM : réponds UNIQUEMENT en JSON valide sans markdown :\n{"question":"...","options":["A. ...","B. ...","C. ...","D. ..."],"correct":0,"explanation":"... [§ref]"}`;}

function openD(){document.getElementById('ov').classList.add('open');document.getElementById('dr').classList.add('open')}
function closeD(){document.getElementById('ov').classList.remove('open');document.getElementById('dr').classList.remove('open')}
function pickT(btn,t){document.querySelectorAll('.theme-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');S.theme=t;S.hist=[];closeD();S.mode==='flash'?rFlash():rMain()}
function setM(m){S.mode=m;S.hist=[];document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById(m==='quiz'?'tQuiz':m==='chat'?'tChat':'tFlash').classList.add('active');m==='flash'?rFlash():rMain()}
function updS(){document.getElementById('sOk').textContent=S.ok;document.getElementById('sKo').textContent=S.ko}

function rMain(){
  const isQ=S.mode==='quiz';
  document.getElementById('mw').innerHTML=`
    <div class="toolbar">
      ${isQ?`<button class="btn bp" id="genBtn" onclick="genQ()">▶ Nouvelle question</button>`:`<span style="font-family:var(--mono);font-size:12px;color:var(--muted)">Pose ta question normative</span>`}
      <button class="btn bg" onclick="clearM()">✕ Vider</button>
      <span class="mt">${isQ?'❓ QCM IA':'💬 Libre'}</span>
    </div>
    <div class="chat-area" id="ca">${S.apiKey?rWelcome():rApiNotice()}</div>
    ${!isQ?`<div class="ibar"><textarea class="minput" id="mi" placeholder="Ta question…" rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendM()}" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,110)+'px'"></textarea><button class="sendbtn" id="sb" onclick="sendM()">↑</button></div>`:''}
  `
}

function rWelcome(){return`<div class="welcome"><h2>Révision Normes AJ</h2><p>Thème : <strong>${S.theme.replace(/_/g,' ')}</strong><br>${S.mode==='quiz'?'Appuie sur <strong>▶ Nouvelle question</strong>':'Pose ta question ci-dessous'}</p><div class="tag-wrap"><span class="tag">NF EN 1176-1</span><span class="tag">+A1:2023</span><span class="tag">NF EN 1177</span><span class="tag">NF EN 16630</span><span class="tag">Décret 96-1136</span></div></div>`}
function rApiNotice(){return`<div class="api-notice"><h3>⚠️ Clé API requise</h3><p>Stockée uniquement dans ce navigateur. Sans clé → utilise les <strong>Flashcards</strong> (offline).</p><div class="api-row"><input type="password" class="api-in" id="apiIn" placeholder="sk-ant-api03-…" value="${S.apiKey}"><button class="btn bp" style="height:44px" onclick="saveK()">OK</button></div><p class="api-note">console.anthropic.com</p></div>`}
function clearM(){S.hist=[];rMain()}

async function genQ(){
  if(!S.apiKey){alert('Renseigne ta clé API.');return}
  if(S.busy)return;S.busy=true;
  const btn=document.getElementById('genBtn');if(btn)btn.disabled=true;
  const p=`Génère une question QCM niveau expert (inspecteur certifié) sur le thème "${S.theme}".\nRéponds UNIQUEMENT en JSON valide, sans texte ni markdown :\n{"question":"...","options":["A. ...","B. ...","C. ...","D. ..."],"correct":0,"explanation":"... [§ref norme]"}`;
  addTyp();
  try{const raw=await callApi([{role:'user',content:p}]);removeTyp();addQCM(raw)}
  catch(e){removeTyp();addB('ai',`❌ ${e.message}`)}
  S.busy=false;if(btn)btn.disabled=false;
}

function addQCM(raw){
  let d;try{d=JSON.parse(raw.replace(/```json|```/g,'').trim())}catch{addB('ai',raw);return}
  const ca=document.getElementById('ca');
  const div=document.createElement('div');div.className='msg';
  div.innerHTML=`<div class="av av-ai">AI</div><div class="bubble"><div class="qc"><div class="ql">${S.theme.replace(/_/g,' ').toUpperCase()}</div><div class="qt">${d.question}</div><div class="opts">${d.options.map((o,i)=>`<button class="opt" data-i="${i}" onclick="pickO(this,${d.correct},'${esc(d.explanation)}')""><span class="ol">${String.fromCharCode(65+i)}</span>${o.replace(/^[A-D]\.\s*/,'')}</button>`).join('')}</div></div></div>`;
  ca.appendChild(div);ca.scrollTop=ca.scrollHeight;
}

function pickO(btn,correct,expl){
  const opts=btn.closest('.opts').querySelectorAll('.opt');
  const idx=parseInt(btn.dataset.i);
  opts.forEach(b=>b.disabled=true);
  opts[correct].classList.add('correct');
  if(idx!==correct){btn.classList.add('wrong');S.ko++}else{S.ok++}
  updS();
  const card=btn.closest('.qc');
  const v=document.createElement('div');
  v.className=`verdict ${idx===correct?'vok':'vko'}`;
  v.innerHTML=(idx===correct?'✅ Correct ! ':'❌ Incorrect. ')+expl;
  card.appendChild(v);
  btn.closest('.bubble').parentElement.scrollIntoView({behavior:'smooth',block:'end'});
}

function esc(s){return(s||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}

async function sendM(){
  const inp=document.getElementById('mi');
  const txt=inp?.value?.trim();
  if(!txt||S.busy)return;
  if(!S.apiKey){alert('Renseigne ta clé API.');return}
  inp.value='';inp.style.height='auto';
  addB('user',txt);S.hist.push({role:'user',content:txt});
  S.busy=true;document.getElementById('sb').disabled=true;
  addTyp();
  try{
    const resp=await callApi(S.hist);removeTyp();
    const html=resp.replace(/NF EN [\d\-\+:]+/g,m=>`<span class="rt">${m}</span>`).replace(/§[\d\.]+[\w]*/g,m=>`<span class="rt">${m}</span>`).replace(/Annexe [A-Z]/g,m=>`<span class="rt">${m}</span>`).replace(/Décret \d{2}-\d+/g,m=>`<span class="rt">${m}</span>`).replace(/\n/g,'<br>');
    addB('ai',html);S.hist.push({role:'assistant',content:resp});
  }catch(e){removeTyp();addB('ai',`❌ ${e.message}`)}
  S.busy=false;document.getElementById('sb').disabled=false;
}

function addB(who,html){
  const ca=document.getElementById('ca');if(!ca)return;
  const d=document.createElement('div');d.className=`msg${who==='user'?' user':''}`;
  d.innerHTML=`<div class="av ${who==='ai'?'av-ai':'av-us'}">${who==='ai'?'AI':'BB'}</div><div class="bubble">${html}</div>`;
  ca.appendChild(d);ca.scrollTop=ca.scrollHeight;
}
function addTyp(){const ca=document.getElementById('ca');if(!ca)return;const d=document.createElement('div');d.className='msg';d.id='typ';d.innerHTML=`<div class="av av-ai">AI</div><div class="bubble"><div class="tw"><span></span><span></span><span></span></div></div>`;ca.appendChild(d);ca.scrollTop=ca.scrollHeight}
function removeTyp(){const t=document.getElementById('typ');if(t)t.remove()}

function rFlash(){
  const fc=FC[S.fi];
  const pct=((S.fi+1)/FC.length*100).toFixed(0);
  document.getElementById('mw').innerHTML=`
    <div class="toolbar">
      <span style="font-family:var(--mono);font-size:12px;color:var(--muted)">🃏 ${FC.length} fiches · offline</span>
      <button class="btn bg" onclick="shuf()">🔀 Mélanger</button>
      <span class="mt">${S.fi+1}/${FC.length}</span>
    </div>
    <div class="fw">
      <div class="fp-wrap"><div class="fp-bar" style="width:${pct}%"></div></div>
      <div class="flashcard" id="fc" onclick="this.classList.toggle('flipped')">
        <div class="fci">
          <div class="fcf ff"><div class="flab">Question ${S.fi+1} / ${FC.length}</div><div class="fq">${fc.q}</div><div class="ftap">👆 Toucher pour la réponse</div></div>
          <div class="fcf fb"><div class="flab">Réponse</div><div class="fa">${fc.a}</div><div class="fr">${fc.ref}</div></div>
        </div>
      </div>
      <div class="fnav">
        <button class="btn bg" onclick="nfc(-1)">← Préc.</button>
        <span class="fcnt">${S.fi+1} / ${FC.length}</span>
        <button class="btn bg" onclick="nfc(1)">Suiv. →</button>
      </div>
    </div>`;
}
function nfc(d){S.fi=(S.fi+d+FC.length)%FC.length;rFlash()}
function shuf(){for(let i=FC.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[FC[i],FC[j]]=[FC[j],FC[i]]}S.fi=0;rFlash()}

async function callApi(messages){
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':S.apiKey,'anthropic-version':'2023-06-01'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:sys(S.theme),messages})});
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error?.message||`HTTP ${r.status}`)}
  const data=await r.json();return data.content?.[0]?.text||'';
}
function saveK(){const v=document.getElementById('apiIn')?.value?.trim();if(v){S.apiKey=v;localStorage.setItem('evn_k',v);rMain()}}

rMain();
</script>
</body>
</html>
